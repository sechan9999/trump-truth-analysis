.sim{font-size:12px;color:var(--mute);line-height:1.5}

footer{font-size:12px;line-height:1.7;color:var(--mute);border-top:1px solid var(--line2);padding-top:16px}

  const au = d.audit ? d.audit.overall : null;
  const audit = au ? (st.lang === 'ko' ? `일치 ${Math.round(au.fit_rate*100)}% (95% CI ${Math.round(au.ci95[0]*100)}–${Math.round(au.ci95[1]*100)}%, 검토자 ${d.audit.reviewers || '?'}명 분담·글당 1명)` : `${Math.round(au.fit_rate*100)}% fit (95% CI ${Math.round(au.ci95[0]*100)}–${Math.round(au.ci95[1]*100)}%; ${d.audit.reviewers || '?'} reviewers, one per post)`) : (st.lang === 'ko' ? '미실시' : 'not yet done');
  return {audit, lv: d.labels ? d.labels.version : '', sil: d.stats ? d.stats.overall_silhouette.toFixed(2) : '', end: m.length ? m[m.length-1].replace('-','.') : '…', total: d.meta.total.toLocaleString(), n: d.meta.analyzed.toLocaleString(), mon, collected: d.meta.collected, max: Math.ceil(mx/10)*10 || 10, lastm: m.length ? short(m[m.length-1]) : '', lastd: +last.slice(8,10) || ''};
}
const esc = x => x.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2 = x => (Math.abs(x) < 0.005 ? 0 : x).toFixed(2); // '-0.00' 방지
const short = m => m.slice(2).replace('-','.');
const fmt = (str, v) => str.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');

function txt(){
  const s = S[st.lang], v = vals();
  document.documentElement.lang = st.lang;
  document.title = s.title.replace(/\.$/,'');
  document.querySelectorAll('[data-t]').forEach(el => {
    const k = el.dataset.t;
    if (k === 'foot') el.innerHTML = fmt(s.foot, v);
    else if (k === 'theme') el.textContent = isDark() ? s.themeL : s.theme;
    else el.textContent = fmt(s[k], v);
  });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === st.lang));
  $('hubtab').href = 'https://us-election-insight-hub-38273401034.us-central1.run.app/us?lang=' + st.lang;
  $('insights').innerHTML = `<p class="note">${s.insNote}</p>` + s.ins.map(([h,b]) => `<p><strong>${h}</strong> ${b}</p>`).join('');
  chips(); periods(); grid(); labels(); draw(); card();
}
function chips(){
  const s = S[st.lang];
  const list = [{k:'all',c:'#9A9A92',name:s.all}].concat(T.map(t => ({k:t.k,c:t.c,name:t[st.lang][0]})));
  $('chips').innerHTML = list.map(t => `<button type="button" class="chip" data-k="${t.k}" aria-pressed="${st.topic===t.k}"><span class="dot" style="background:${t.c}"></span>${t.name}</button>`).join('');
  $('chips').querySelectorAll('button').forEach(b => b.onclick = () => { st.topic = b.dataset.k === 'all' ? 'all' : +b.dataset.k; chips(); labels(); draw(); });
  const sk = $('selKw');
  if (st.topic === 'all') sk.style.display = 'none';
  else { sk.style.display = 'block'; sk.innerHTML = `${s.kw} · <span class="kw" style="font-size:13px">${byK[st.topic].st.keywords.join(', ')}</span>`; }
}
function periods(){
  $('periods').innerHTML = S[st.lang].periods.map((p,i) => `<button type="button" class="pbtn" data-i="${i}" aria-pressed="${st.period===i}">${p}</button>`).join('');
  $('periods').querySelectorAll('button').forEach(b => b.onclick = () => { st.period = +b.dataset.i; periods(); draw(); });
}
function grid(){
  const s = S[st.lang], d = D(), M = d.months.map(short), top0 = vals().max;
  if (!M.length) { $('grid').innerHTML = ''; return; }
  $('grid').innerHTML = T.map(t => {
    const v = d.counts[t.k] || [], mx = Math.max(...v), top = v.indexOf(mx), n = v.reduce((a,b)=>a+b,0);
    const bars = v.map((x,m) => `<div title="${M[m]} ${x}${s.unit}" style="height:${x/top0*100}%;background:${t.c}${m===top?'':'59'}"></div>`).join('');
    return `<div class="mini"><div style="display:flex;align-items:center;gap:8px"><span class="dot" style="width:10px;height:10px;background:${t.c}"></span><h3>${t[st.lang][0]}</h3><span class="n">${n.toLocaleString()}${s.unit}</span></div><p class="desc">${t[st.lang][1]}</p><div class="badges"><span class="badge">${s.coh} ${f2(t.st.cohesion)}</span><span class="badge">${s.bnd} ${Math.round(t.st.boundary_share*100)}%</span>${t.st.cohesion < 0.05 ? `<span class="badge warn">${s.caution}</span>` : ''}${D().audit && D().audit.by_cluster[t.k] ? `<span class="badge">${s.fitb} ${Math.round(D().audit.by_cluster[t.k].fit_rate*100)}% (${D().audit.by_cluster[t.k].fit}/${D().audit.by_cluster[t.k].n})</span>` : ''}</div><p class="kw">${t.st.keywords.join(', ')}</p><div class="bars">${bars}</div><div class="axis"><span>${M[0]}</span><span>${s.peak} ${M[top]} · ${mx}${s.unit}</span><span>${M[M.length-1]}</span></div><div class="note" style="font-size:12px">${s.ex}</div><ul class="ex">${t.st.exemplars.map(([id, x]) => `<li><a href="https://truthsocial.com/@realDonaldTrump/${id}" target="_blank" rel="noopener">${esc(x.length > 110 ? x.slice(0,110) + '…' : x)}</a></li>`).join('')}</ul></div>`;
  }).join('');
}
function labels(){
  $('labels').innerHTML = T.filter(t => st.topic==='all' || st.topic===t.k).map(t => `<div class="lbl" style="left:${t.x}%;top:${t.y}%">${t[st.lang][0]}</div>`).join('');
}
function isDark(){
  const a = document.documentElement.dataset.theme;
  return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function draw(){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  const s = S[st.lang];
  if (!st.data) { $('count').textContent = ''; return; }
  const [m0,m1] = PER[st.period];
  const dim = getComputedStyle(document.documentElement).getPropertyValue('--dim').trim();
  const lit = []; shown = [];
  st.data.pts.forEach((p,i) => {
    if (p[3] < m0 || p[3] > m1) return;
    const on = st.topic === 'all' || st.topic === p[2];
    const o = {i, x:p[0]/100*r.width, y:p[1]/100*r.height, on};
    shown.push(o);
    if (on) lit.push(o); else { ctx.fillStyle = dim; ctx.beginPath(); ctx.arc(o.x,o.y,1.6,0,7); ctx.fill(); }
  });
  lit.forEach(o => { ctx.fillStyle = byK[st.data.pts[o.i][2]].c; ctx.beginPath(); ctx.arc(o.x,o.y,2.2,0,7); ctx.fill(); });
  if (st.sel !== null) { const p = st.data.pts[st.sel]; ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink'); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p[0]/100*r.width,p[1]/100*r.height,6,0,7); ctx.stroke(); }
  $('count').textContent = st.topic === 'all' ? shown.length.toLocaleString() + s.unit : lit.length.toLocaleString() + ' / ' + shown.length.toLocaleString() + s.unit;
}
function nearest(e){
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 64;
  shown.forEach(o => { if (st.topic !== 'all' && !o.on) return; const d = (o.x-x)**2 + (o.y-y)**2; if (d < bd) { bd = d; best = o; } });
  return best ? {o:best, x, y} : null;
}
function card(){
  const s = S[st.lang];
  if (st.sel === null || !st.data) { $('post').style.display = 'none'; return; }
  const p = st.data.pts[st.sel], q = st.data.posts[st.sel], t = byK[p[2]];
  $('pTopic').textContent = t[st.lang][0]; $('pTopic').style.color = t.c;
  $('pDate').textContent = q[0] + ' ' + s.et + ' · Truth Social';
  $('pText').textContent = q[1];
  const nx = byK[q[3]], bd = q[4] - q[5] < 0.03;
  $('pSim').innerHTML = `${s.sim} ${f2(q[4])} · ${s.next} <span style="color:${nx.c}">${nx[st.lang][0]}</span> ${f2(q[5])}${bd ? ` · <strong>${s.boundary}</strong>` : ''}<br>${s.simNote}`;
  $('pLink').href = 'https://truthsocial.com/@realDonaldTrump/' + q[2];
  $('pLink').textContent = s.orig;
  $('post').style.display = 'flex';
}
cv.addEventListener('mousemove', e => {
  const n = st.data && nearest(e), tip = $('tip');
  if (!n) { tip.style.display = 'none'; return; }
  const p = st.data.pts[n.o.i];
  tip.textContent = st.data.posts[n.o.i][0] + ' · ' + byK[p[2]][st.lang][0];
  tip.style.display = 'block';
  tip.style.left = Math.min(n.x + 12, cv.clientWidth - tip.offsetWidth - 4) + 'px';
  tip.style.top = (n.y + 12) + 'px';
});
cv.addEventListener('mouseleave', () => $('tip').style.display = 'none');
cv.addEventListener('click', e => { const n = st.data && nearest(e); st.sel = n ? n.o.i : null; draw(); card(); });
$('pClose').onclick = () => { st.sel = null; draw(); card(); };
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  st.lang = b.dataset.lang;
  try { localStorage.setItem('tts-lang', st.lang); } catch(e) {}
  txt();
});
$('theme').onclick = () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; txt(); };
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 100); });
txt();
fetch('map_data.json', {cache: 'no-cache'}).then(r => r.json()).then(d => {
  st.data = d;
  T = ORDER.map(k => Object.assign({k, st: d.stats.clusters[k]}, d.labels.clusters[k]));
  T.forEach(t => byK[t.k] = t);
  txt();
}).catch(() => { $('count').textContent = 'data load failed'; });
</script>
</body>
</html>
